<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c111c">
<meta name="mobile-web-app-capable" content="yes">
<title>Registro Voti</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237aa2ff'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='%230a1020' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: una colonna centrata, barra con schede + filtro periodo, sezioni a schede sotto. Scuro di base, chiaro se il sistema lo chiede. */
:root{
  --bg:#0c111c; --surface:#131a29; --surface-2:#1a2336; --line:#27324b; --line-soft:#1d2740;
  --fg:#e7ebf4; --fg-2:#a6b0c6; --fg-3:#7280a0;
  --accent:#7aa2ff; --accent-ink:#0a1020; --accent-soft:rgba(122,162,255,.15);
  --ok:#52d6a8; --ok-soft:rgba(82,214,168,.14);
  --warn:#f2b64a; --warn-soft:rgba(242,182,74,.15);
  --bad:#ff7b84; --bad-soft:rgba(255,123,132,.15);
  --font-display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eef1f8; --line:#d5dbea; --line-soft:#e4e8f2;
    --fg:#141b2d; --fg-2:#46526e; --fg-3:#76829b;
    --accent:#2e5ad6; --accent-ink:#ffffff; --accent-soft:rgba(46,90,214,.10);
    --ok:#0c8a65; --ok-soft:rgba(12,138,101,.12);
    --warn:#9c6307; --warn-soft:rgba(156,99,7,.12);
    --bad:#c4313f; --bad-soft:rgba(196,49,63,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eef1f8; --line:#d5dbea; --line-soft:#e4e8f2;
  --fg:#141b2d; --fg-2:#46526e; --fg-3:#76829b;
  --accent:#2e5ad6; --accent-ink:#ffffff; --accent-soft:rgba(46,90,214,.10);
  --ok:#0c8a65; --ok-soft:rgba(12,138,101,.12);
  --warn:#9c6307; --warn-soft:rgba(156,99,7,.12);
  --bad:#c4313f; --bad-soft:rgba(196,49,63,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg); color:var(--fg); font:15px/1.5 var(--font-body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{margin:0;font-family:var(--font-display);text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Intestazione */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:22px 0 16px}
.brand h1{font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:3px 0 0;color:var(--fg-3);font-size:13px}
.top-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg-3);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--warn)} .sync.err i{background:var(--bad)}
.btn,.btn-primary{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-primary:hover{filter:brightness(1.08)}
.btn-danger{border-color:var(--bad);color:var(--bad)}
.lnk{appearance:none;background:none;border:0;padding:6px 4px;color:var(--fg-2);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.lnk:hover{color:var(--fg)} .lnk.bad{color:var(--bad)}

/* Barra schede + periodo */
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;color:var(--fg-2);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px;margin-bottom:8px}
.seg button{appearance:none;border:0;background:none;color:var(--fg-2);padding:6px 11px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* Schede e testi */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:18px}
.card + .card, .stack > * + *{margin-top:16px}
.card h2{font-size:15px;font-weight:600;margin-bottom:4px}
.sub{color:var(--fg-3);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.empty{text-align:center;padding:36px 18px}
.empty h2{font-size:18px;margin-bottom:6px}
.empty p{color:var(--fg-2);margin:0 auto 16px;max-width:42ch}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;background:var(--warn-soft);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.demo b{color:var(--warn)}

/* Panoramica */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 32px;align-items:center}
.big{font:700 68px/1 var(--font-display);letter-spacing:-.03em;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.big.ok{color:var(--ok)} .big.warn{color:var(--warn)} .big.bad{color:var(--bad)}
.hero-sub{margin:0;color:var(--fg-2);font-size:14px}
.delta{margin:8px 0 0;font-size:13px;font-weight:500}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.facts{margin:0;display:grid;gap:12px}
.facts div{display:grid;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.facts div:last-child{border-bottom:0;padding-bottom:0}
.facts dt{font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:0;font-size:15px;min-width:0;overflow-wrap:anywhere}
.facts small{color:var(--fg-3)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 9px;border-radius:6px;font:600 15px var(--font-display);font-variant-numeric:tabular-nums;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

/* Grafici */
.chart-wrap{position:relative;margin-top:6px}
.chart-wrap svg{display:block;max-width:100%;height:auto;touch-action:pan-y;overflow:visible}
.grid{stroke:var(--line-soft);stroke-width:1}
.axis-t{fill:var(--fg-3);font:11px var(--font-body)}
.suff{stroke:var(--fg-3);stroke-width:1;stroke-dasharray:4 4;opacity:.8}
.suff-t{fill:var(--fg-3);font:11px var(--font-body)}
.cut{stroke:var(--fg-3);stroke-width:1;stroke-dasharray:2 4}
.ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--accent-soft);stroke:none}
.dot-ok{fill:var(--ok)} .dot-warn{fill:var(--warn)} .dot-bad{fill:var(--bad)}
.dot{stroke:var(--surface);stroke-width:1.5}
.endv{fill:var(--fg);font:600 13px var(--font-display)}
.hv-c{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;z-index:3;max-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.tip b{font-weight:600}
.tip .m{color:var(--fg-3)}

/* Righe per materia */
.subj{appearance:none;display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr) 58px;gap:6px 14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-soft);padding:11px 4px;cursor:pointer;color:inherit}
.subj:first-of-type{border-top:0}
.subj:hover{background:var(--surface-2)}
.s-name{min-width:0}
.s-name b{display:block;font-weight:600;overflow-wrap:anywhere}
.s-name small{color:var(--fg-3);font-size:12px}
.track{position:relative;height:8px;background:var(--surface-2);border-radius:4px}
.fill{height:100%;border-radius:4px}
.fill.ok{background:var(--ok)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.mark6{position:absolute;left:60%;top:-3px;bottom:-3px;width:1px;background:var(--fg-3)}
.s-avg{text-align:right;font:600 17px var(--font-display);font-variant-numeric:tabular-nums}
.s-avg.ok{color:var(--ok)} .s-avg.warn{color:var(--warn)} .s-avg.bad{color:var(--bad)} .s-avg.none{color:var(--fg-3);font-weight:400}

/* Materie */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer}
.chip b{color:var(--fg);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip[aria-pressed="true"] b{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px}
.stat span{display:block;font-size:12px;color:var(--fg-3)}
.stat b{display:block;font:600 22px var(--font-display);font-variant-numeric:tabular-nums;margin-top:2px}
.stat b.ok{color:var(--ok)} .stat b.warn{color:var(--warn)} .stat b.bad{color:var(--bad)}
.types{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0;color:var(--fg-2);font-size:14px}
.types span b{color:var(--fg);font-variant-numeric:tabular-nums}

/* Elenco voti */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.filters .field{min-width:150px;flex:1 1 150px}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line-soft)}
.row:first-of-type{border-top:0}
.r-date{font-size:13px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.r-main{min-width:0;overflow-wrap:anywhere}
.r-main b{font-weight:600;margin-right:8px}
.tag{display:inline-block;font-size:11px;color:var(--fg-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;vertical-align:middle}
.r-note{color:var(--fg-3);font-size:13px;margin-top:2px}
.acts{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg-2);justify-content:flex-end}

/* Form */
.panel{border-color:var(--accent);margin-bottom:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px 14px}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field.wide{grid-column:1/-1}
label,.lab{font-size:12px;color:var(--fg-2);font-weight:500}
.hint{color:var(--fg-3);font-weight:400;margin-left:6px}
input[type="text"],input[type="number"],input[type="date"],select{width:100%;min-height:42px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:16px;color:var(--fg)}
input:focus,select:focus{border-color:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.key{appearance:none;min-width:42px;min-height:38px;border:1px solid var(--line);background:var(--surface);border-radius:7px;font:600 15px var(--font-display);cursor:pointer;color:var(--fg)}
.key:hover{background:var(--surface-2)}
.key.m{color:var(--accent);border-color:var(--accent-soft)}
.keys .sep{width:10px}
.err{margin:10px 0 0;color:var(--bad);font-size:13px}
.panel-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* Simulatore */
.sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.sim{background:var(--bg);border:1px solid var(--line-soft);border-radius:10px;padding:14px}
.sim span{font-size:12px;color:var(--fg-3);display:block}
.sim b{display:block;font:700 34px/1.1 var(--font-display);margin:4px 0;font-variant-numeric:tabular-nums}
.sim b.ok{color:var(--ok)} .sim b.warn{color:var(--warn)} .sim b.bad{color:var(--bad)}
.sim small{color:var(--fg-2);font-size:13px}
.now{margin:12px 0 0;color:var(--fg-2);font-size:14px}
.wi{display:grid;gap:8px;margin-top:14px}
.wi div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;font-size:14px}
.wi .up{color:var(--ok)} .wi .down{color:var(--bad)}

/* Impostazioni */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid2 .card + .card{margin-top:0}
.grid2 .wide{grid-column:1/-1}
.radio{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;cursor:pointer}
.radio input{margin-top:4px;accent-color:var(--accent)}
.radio small{display:block;color:var(--fg-3)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.srow:first-of-type{border-top:0}
.srow small{color:var(--fg-3)}
.addrow{display:flex;gap:10px;margin-top:12px}
.addrow input{flex:1;min-width:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px)}

@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .big{font-size:58px}
  .row{grid-template-columns:48px minmax(0,1fr) auto}
  .row .acts{grid-column:2/-1;justify-content:flex-start}
  .subj{grid-template-columns:minmax(0,1fr) 58px}
  .subj .track{grid-column:1/-1;order:3}
  .card{padding:16px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="wrap">

    <div class="brand">

      <span class="sync busy" id="sync" role="status"><i></i><span>Connessione…</span></span>

  <div class="bar">

    <div class="seg" id="seg" role="group" aria-label="Periodo"></div>

  <div id="banner"></div>
  <div id="formHost"></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
/* ===== CONFIGURAZIONE FIREBASE: incolla qui i valori del tuo progetto (vedi LEGGIMI.md) ===== */
const FIREBASE_CONFIG = {

const FB_VER = '11.0.2';

(function(){
'use strict';

/*PURE-START*/
var MONTHS=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
var DAY=864e5;

function parseGrade(raw){
  var s=String(raw==null?'':raw).trim().replace(/\s+/g,'').replace(',','.').replace(/[−–]/g,'-');
  if(!s) return null;
  var m=s.match(/^(\d{1,2})\/(\d{1,2})$/);
  if(m){
    var a=+m[1], b=+m[2];
    if(Math.abs(a-b)!==1) return null;
    var v=(a+b)/2;
    if(v<1||v>10) return null;
    return {value:v,label:Math.min(a,b)+'/'+Math.max(a,b)};
  }
  m=s.match(/^(\d{1,2})(?:\.(\d{1,2}))?(\+|-|½)?$/);
  if(!m) return null;

  var val=m[2]?parseFloat(m[1]+'.'+m[2]):+m[1];
  if(m[3]==='+') val+=0.25; else if(m[3]==='-') val-=0.25; else if(m[3]==='½') val+=0.5;
  if(val<1||val>10) return null;
  var label=s.replace('.',',');
  if(!m[3]&&m[2]&&val%1===0.5) label=Math.floor(val)+'½';
  return {value:val,label:label};
}
function fmtGrade(x){
  var q=Math.ceil(x*4-1e-9)/4, i=Math.floor(q+1e-9), fr=Math.round((q-i)*4);
  if(fr===0) return String(i);
  if(fr===1) return i+'+';
  if(fr===2) return i+'½';
  return (i+1)+'-';
}
function cmp(a,b){ return a.date<b.date?-1:a.date>b.date?1:((a.ts||0)-(b.ts||0)); }
function ts(d){ return Date.parse(d+'T12:00:00'); }
function bySubject(gs){
  var m=new Map();
  gs.forEach(function(g){
    var o=m.get(g.subject);
    if(!o){ o={n:0,sum:0,list:[]}; m.set(g.subject,o); }
    o.n++; o.sum+=g.value; o.list.push(g);
  });
  m.forEach(function(o){ o.avg=o.sum/o.n; });
  return m;
}
function generalAvg(gs,mode){
  if(!gs.length) return null;
  if(mode==='all') return gs.reduce(function(a,g){return a+g.value;},0)/gs.length;
  var m=bySubject(gs), s=0;
  m.forEach(function(o){ s+=o.avg; });
  return s/m.size;
}
function generalSeries(gs,mode){
  var s=gs.slice().sort(cmp), out=[], sums=new Map(), tot=0, n=0;
  for(var i=0;i<s.length;i++){
    var g=s[i], o=sums.get(g.subject)||{n:0,sum:0};
    o.n++; o.sum+=g.value; sums.set(g.subject,o); tot+=g.value; n++;
    var nx=s[i+1];
    if(nx&&nx.date===g.date) continue;
    var v;
    if(mode==='all') v=tot/n;
    else { var t=0; sums.forEach(function(x){ t+=x.sum/x.n; }); v=t/sums.size; }
    out.push({t:ts(g.date),v:v,date:g.date,day:s.filter(function(x){return x.date===g.date;})});
  }
  return out;
}
function withGrades(gs,subject,value,m){

  for(var i=0;i<m;i++) out.push({subject:subject,value:value,date:'9999-12-31',ts:i});
  return out;
}
function neededGrade(gs,mode,goal,subject,target,m){
  var subs=bySubject(gs), o=subs.get(subject)||{n:0,sum:0,avg:0};
  if(goal==='subject') return (target*(o.n+m)-o.sum)/m;
  if(mode==='all'){
    var S=gs.reduce(function(a,g){return a+g.value;},0), N=gs.length;
    return (target*(N+m)-S)/m;
  }
  var A=0;
  subs.forEach(function(x,n){ if(n!==subject) A+=x.avg; });
  var K=subs.size+(o.n>0?0:1);
  var R=target*K-A;
  return (R*(o.n+m)-o.sum)/m;
}

var ref=null, fb=null, saving=false, pending=false, saveTimer=null, syncTimer=null, syncMode='connecting', user=null, unsub=null;
function fbConfigured(){
  return !!FIREBASE_CONFIG&&Object.keys(FIREBASE_CONFIG).every(function(k){ var v=FIREBASE_CONFIG[k]; return v&&String(v).indexOf('INCOLLA')<0; });
}
function setSync(mode){
  syncMode=mode;

  var map={
    connecting:['busy','Connessione…'],
    busy:['busy','Salvataggio…'],

function storageText(){

  if(syncMode==='signedout') return 'Per ora i voti sono solo su questo dispositivo. Accedi con Google per salvarli online e ritrovarli sull\'altro dispositivo.';
  if(syncMode==='nofb') return 'Firebase non è ancora configurato in questo sito: i voti restano solo su questo browser. Segui la guida (LEGGIMI.md) per attivare la sincronizzazione.';

function renderAcct(){
  var el=$('#acct'); if(!el) return;
  if(!fbConfigured()||!fb){ el.innerHTML=''; return; }
  el.innerHTML=user?'<button class="btn" type="button" data-a="signout" title="'+esc(user.email||'')+'">Esci</button>':'<button class="btn" type="button" data-a="signin">Accedi con Google</button>';
}
function flush(){
  if(!ref||!fb) return;
  if(saving){ pending=true; return; }
  saving=true; setSync('busy');
  (function loop(){
    pending=false;
    fb.setDoc(ref,JSON.parse(JSON.stringify(state))).then(function(){
      if(pending) return loop();
      saving=false; setSync('ok');
    },function(){ saving=false; setSync('err'); });
  })();
}
function commit(){
  state.savedAt=Date.now();
  localSave();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,350);
}
function onRemote(snap){
  clearTimeout(syncTimer);
  if(snap.metadata.hasPendingWrites) return;
  var d=snap.exists()?snap.data():null, cached=snap.metadata.fromCache;
  if(d){
    var r=normalize(d);
    if(r.savedAt>state.savedAt){ state=r; localSave(); renderAll(); }
    else if(r.savedAt<state.savedAt && !cached){ flush(); }
  } else if(!cached && state.savedAt>0){
    flush();
  }
  if(cached){ syncTimer=setTimeout(function(){ setSync('late'); },10000); }
  if(!saving) setSync(cached?'connecting':'ok');
}
function initDb(){
  if(!fbConfigured()){ setSync('nofb'); renderAcct(); return; }
  var base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]).then(function(m){
    var app=m[0].initializeApp(FIREBASE_CONFIG), auth=m[1].getAuth(app), db;
    try{ db=m[2].initializeFirestore(app,{localCache:m[2].persistentLocalCache({tabManager:m[2].persistentMultipleTabManager()})}); }
    catch(e){ db=m[2].getFirestore(app); }
    fb={auth:auth,db:db,doc:m[2].doc,onSnapshot:m[2].onSnapshot,setDoc:m[2].setDoc,Provider:m[1].GoogleAuthProvider,signIn:m[1].signInWithPopup,signOut:m[1].signOut};
    m[1].onAuthStateChanged(auth,function(u){
      user=u; if(unsub){ unsub(); unsub=null; } ref=null; clearTimeout(syncTimer);
      renderAcct();
      if(!u){ setSync('signedout'); return; }
      ref=fb.doc(db,'users',u.uid);
      setSync('connecting');
      syncTimer=setTimeout(function(){ setSync('late'); },10000);
      unsub=fb.onSnapshot(ref,onRemote,function(){ setSync('err'); });
    });
  }).catch(function(){ setSync('local'); renderAcct(); });
}

var redraws=[];
function drawChart(host,o){
  function paint(){
    var pts=[];
    o.lines.forEach(function(l){ pts=pts.concat(l.pts); });
    pts=pts.concat(o.dots||[]);
    if(!pts.length){ host.innerHTML=''; return; }
    var W=Math.max(260,Math.floor(host.clientWidth||560)), H=W<480?220:280;
    var m={l:30,r:18,t:18,b:28};
    var t0=Math.min.apply(null,pts.map(function(p){return p.t;})), t1=Math.max.apply(null,pts.map(function(p){return p.t;}));
    var pad=Math.max((t1-t0)*0.05,4*DAY); t0-=pad; t1+=pad;
    var vmin=Math.min.apply(null,pts.map(function(p){return p.v;}));
    var yMin=Math.max(1,Math.min(5,Math.floor(vmin)-1)), yMax=10;
    function X(t){ return m.l+(t-t0)/(t1-t0)*(W-m.l-m.r); }
    function Y(v){ return m.t+(yMax-v)/(yMax-yMin)*(H-m.t-m.b); }
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(o.label)+'">';
    for(var v=yMin;v<=yMax;v++){
      s+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="axis-t" x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';
    }
    s+='<line class="suff" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(6)+'" y2="'+Y(6)+'"/><text class="suff-t" x="'+(m.l+4)+'" y="'+(Y(6)-5)+'">sufficienza</text>';
    var ticks=[], range=t1-t0, i;
    if(range>=75*DAY){
      var d=new Date(t0); d=new Date(d.getFullYear(),d.getMonth()+1,1,12);
      while(+d<t1){ ticks.push({t:+d,l:MONTHS[d.getMonth()]+(d.getMonth()===0?' '+d.getFullYear():''),a:'middle'}); d=new Date(d.getFullYear(),d.getMonth()+1,1,12); }
      var step=Math.ceil(ticks.length/Math.max(2,Math.floor((W-m.l-m.r)/54)));
      ticks=ticks.filter(function(_,k){return k%step===0;});
    } else {
      for(i=0;i<=4;i++){ var tt=t0+range*i/4, dd=new Date(tt); ticks.push({t:tt,l:dd.getDate()+' '+MONTHS[dd.getMonth()],a:i===0?'start':i===4?'end':'middle'}); }
    }
    ticks.forEach(function(k){ s+='<text class="axis-t" x="'+X(k.t)+'" y="'+(H-8)+'" text-anchor="'+k.a+'">'+k.l+'</text>'; });
    if(o.cutoffT&&o.cutoffT>t0&&o.cutoffT<t1){
      s+='<line class="cut" x1="'+X(o.cutoffT)+'" x2="'+X(o.cutoffT)+'" y1="'+m.t+'" y2="'+(H-m.b)+'"/><text class="axis-t" x="'+(X(o.cutoffT)+5)+'" y="'+(m.t-5)+'">2° quadrimestre</text>';
    }
    o.lines.forEach(function(l,li){
      if(!l.pts.length) return;
      var path=l.pts.map(function(p,k){return (k?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1);}).join(' ');
      if(l.area&&l.pts.length>1){
        s+='<path class="ar" d="'+path+' L'+X(l.pts[l.pts.length-1].t).toFixed(1)+' '+Y(yMin)+' L'+X(l.pts[0].t).toFixed(1)+' '+Y(yMin)+'Z"/>';
      }
      if(l.pts.length>1) s+='<path class="ln" d="'+path+'"/>';
    });
    (o.dots||[]).forEach(function(p){ s+='<circle class="dot dot-'+p.c+'" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4"/>'; });
    var main=o.lines[0].pts, last=main[main.length-1];
    if(last){
      var lx=X(last.t), ly=Y(last.v);
      s+='<circle class="hv-c" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5"/>';
      s+='<text class="endv" x="'+Math.min(lx,W-m.r-4).toFixed(1)+'" y="'+(ly-12).toFixed(1)+'" text-anchor="'+(lx>W-60?'end':'middle')+'">'+f2(last.v)+'</text>';
    }
    s+='<line class="cut hv-l" y1="'+m.t+'" y2="'+(H-m.b)+'" style="display:none"/><circle class="hv-c hv-d" r="5" style="display:none"/>';
    s+='</svg><div class="tip" hidden></div>';
    host.className='chart-wrap';
    host.innerHTML=s;
    var svg=$('svg',host), tip=$('.tip',host), gl=$('.hv-l',host), gd=$('.hv-d',host);
    function hide(){ tip.hidden=true; gl.style.display='none'; gd.style.display='none'; }
    function show(cx){
      var r=svg.getBoundingClientRect(), x=(cx-r.left)*(W/r.width), best=null, bd=1e9;
      (o.hover||[]).forEach(function(h){ var dx=Math.abs(X(h.t)-x); if(dx<bd){ bd=dx; best=h; } });
      if(!best){ hide(); return; }
      var bx=X(best.t), by=Y(best.v);
      gl.setAttribute('x1',bx); gl.setAttribute('x2',bx); gl.style.display='';
      gd.setAttribute('cx',bx); gd.setAttribute('cy',by); gd.style.display='';
      tip.innerHTML=best.html; tip.hidden=false;
      var tw=tip.offsetWidth, left=bx+14; if(left+tw>W) left=bx-tw-14; if(left<0) left=0;
      tip.style.left=left+'px';
    }
    svg.addEventListener('pointermove',function(e){ show(e.clientX); });
    svg.addEventListener('pointerdown',function(e){ show(e.clientX); });
    svg.addEventListener('pointerleave',hide);
  }
  paint();
  redraws.push({host:host,w:host.clientWidth,paint:paint});
}

function viewSubject(){

  if(!state.grades.length) return emptyCard('Ancora nessun voto','Quando inserisci i voti puoi guardare ogni materia una per una.');
  if(!ui.subject||state.subjects.indexOf(ui.subject)<0){
    ui.subject=state.subjects.filter(function(n){return m.has(n);})[0]||state.subjects[0];
  }
  var h='<div class="chips" role="group" aria-label="Materia">';
  state.subjects.forEach(function(n){
    h+='<button class="chip" type="button" data-a="selsubj" data-s="'+esc(n)+'" aria-pressed="'+(n===ui.subject)+'">'+esc(n)+(m.has(n)?'<b>'+f2(m.get(n).avg)+'</b>':'')+'</button>';
  });
  h+='</div>';
  var o=m.get(ui.subject);
  if(!o){
    return h+emptyCard('Nessun voto in '+ui.subject,'Per '+PERIOD_LABEL[ui.period]+' non hai ancora voti in questa materia.','<button class="btn-primary" type="button" data-a="addfor" data-s="'+esc(ui.subject)+'">＋ Aggiungi un voto in '+esc(ui.subject)+'</button>');
  }
  var list=o.list.slice().sort(cmp), vals=list.map(function(g){return g.value;});
  var mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals), l3=list.slice(-3), l3avg=l3.reduce(function(a,g){return a+g.value;},0)/l3.length;
  h+='<div class="stats">'+
    '<div class="stat"><span>Media</span><b class="'+cls(o.avg)+'">'+f2(o.avg)+'</b></div>'+
    '<div class="stat"><span>Voti</span><b>'+o.n+'</b></div>'+
    '<div class="stat"><span>Migliore</span><b>'+f2(mx)+'</b></div>'+
    '<div class="stat"><span>Peggiore</span><b class="'+(mn<6?cls(mn):'')+'">'+f2(mn)+'</b></div>'+
    '<div class="stat"><span>Ultimi '+l3.length+(l3.length===1?' voto':' voti')+'</span><b class="'+cls(l3avg)+'">'+f2(l3avg)+'</b></div></div>';
  h+='<div class="stack"><section class="card"><h2>Andamento in '+esc(ui.subject)+'</h2><p class="sub">I punti sono i voti, la linea è la media man mano che arrivano.</p><div id="chSubj"></div></section>';
  var tp=TYPES.map(function(t){
    var x=list.filter(function(g){return g.type===t;}); if(!x.length) return '';
    return '<span>'+t+' <b>'+f2(x.reduce(function(a,g){return a+g.value;},0)/x.length)+'</b> ('+x.length+')</span>';
  }).filter(Boolean).join('');
  if(tp) h+='<section class="card"><h2>Per tipo di prova</h2><p class="sub">Dove vai meglio: scritto, orale, pratico o laboratorio.</p><p class="types">'+tp+'</p></section>';
  h+='<section class="card"><h2>Tutti i voti</h2><div style="margin-top:8px">'+list.slice().reverse().map(function(g){return rowHTML(g,false);}).join('')+'</div></section></div>';
  return h;
}
function afterSubject(){
  var gs=gradesP(), m=bySubject(gs), o=m.get(ui.subject); if(!o) return;
  var list=o.list.slice().sort(cmp), sum=0, line=[], dots=[], hover=[];
  list.forEach(function(g,i){
    sum+=g.value; var avg=sum/(i+1), t=ts(g.date);
    line.push({t:t,v:avg}); dots.push({t:t,v:g.value,c:cls(g.value)});
    hover.push({t:t,v:g.value,html:'<b>'+dLong(g.date)+'</b><br>Voto <b>'+esc(g.label)+'</b> · '+esc(g.type)+'<br>Media dopo: <b>'+f2(avg)+'</b>'+(g.note?'<br><span class="m">'+esc(g.note)+'</span>':'')});
  });
  drawChart($('#chSubj'),{label:'Andamento in '+ui.subject,lines:[{pts:line,area:false}],dots:dots,hover:hover,cutoffT:ui.period==='all'?ts(state.settings.cutoff):null});
}

  var gs=gradesP().filter(function(g){return (!ui.fSubject||g.subject===ui.fSubject)&&(!ui.fType||g.type===ui.fType);}).sort(cmp).reverse();
  var h='<section class="card"><div class="filters"><div class="field"><label for="fSubject">Materia</label><select id="fSubject"><option value="">Tutte</option>'+
    state.subjects.map(function(n){return '<option value="'+esc(n)+'"'+(n===ui.fSubject?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select></div>'+

function viewSim(){
  if(!state.grades.length) return emptyCard('Ancora nessun voto','Il simulatore calcola che voto ti serve partendo dai voti che hai già inseriti.');
  var m=bySubject(gradesP());
  if(!ui.simSubject||state.subjects.indexOf(ui.simSubject)<0) ui.simSubject=state.subjects.filter(function(n){return m.has(n);})[0]||state.subjects[0];
  if(!ui.wiSubject||state.subjects.indexOf(ui.wiSubject)<0) ui.wiSubject=ui.simSubject;
  var opts=function(sel){ return state.subjects.map(function(n){return '<option value="'+esc(n)+'"'+(n===sel?' selected':'')+'>'+esc(n)+'</option>';}).join(''); };
  return '<div class="stack"><section class="card"><h2>Che voto mi serve?</h2><p class="sub">Calcolato sui voti di '+PERIOD_LABEL[ui.period]+'. Scegli il periodo in alto a destra.</p>'+
    '<div class="form-grid"><div class="field"><label for="simGoal">Obiettivo</label><select id="simGoal"><option value="subject"'+(ui.simGoal==='subject'?' selected':'')+'>Media di una materia</option><option value="general"'+(ui.simGoal==='general'?' selected':'')+'>Media generale</option></select></div>'+
    '<div class="field"><label for="simSubject">'+(ui.simGoal==='general'?'Materia in cui prendo i voti':'Materia')+'</label><select id="simSubject">'+opts(ui.simSubject)+'</select></div>'+
    '<div class="field"><label for="simTarget">Media da raggiungere</label><input id="simTarget" type="number" inputmode="decimal" min="1" max="10" step="0.1" value="'+ui.simTarget+'"></div></div>'+
    '<div id="simOut"></div></section>'+
    '<section class="card"><h2>E se prendo…</h2><p class="sub">Prova un voto prima che arrivi e guarda come cambiano le medie.</p>'+
    '<div class="form-grid"><div class="field"><label for="wiSubject">Materia</label><select id="wiSubject">'+opts(ui.wiSubject)+'</select></div>'+
    '<div class="field"><label for="wiGrade">Voto <span class="hint">es. 7, 6½, 5+</span></label><input id="wiGrade" type="text" autocomplete="off" maxlength="6" value="'+esc(ui.wiGrade)+'"></div></div>'+
    '<div id="wiOut"></div></section></div>';
}
function simOut(){
  var el=$('#simOut'); if(!el) return;
  var gs=gradesP(), T=ui.simTarget, sub=ui.simSubject;
  if(!(T>=1&&T<=10)){ el.innerHTML='<p class="err">Inserisci una media tra 1 e 10.</p>'; return; }
  var cur=ui.simGoal==='subject'?(bySubject(gs).get(sub)?bySubject(gs).get(sub).avg:null):generalAvg(gs,mode());
  var cnt=bySubject(gs).get(sub)?bySubject(gs).get(sub).n:0;
  var h='<p class="now">'+(ui.simGoal==='subject'?'Ora in '+esc(sub)+': '+(cur==null?'nessun voto':'media <b class="num">'+f2(cur)+'</b> su '+cnt+(cnt===1?' voto':' voti')):'Ora: media generale <b class="num">'+f2(cur)+'</b>')+' · obiettivo <b class="num">'+f2(T)+'</b></p><div class="sim-grid">';
  [1,2,3].forEach(function(n){
    var x=neededGrade(gs,mode(),ui.simGoal,sub,T,n), t=n===1?'Con 1 voto':'Con '+n+' voti uguali';
    if(x<=1+1e-9){ h+='<div class="sim"><span>'+t+'</span><b class="ok">Già ok</b><small>anche con un 1 resti sopra '+f2(T)+'</small></div>'; }
    else if(x>10+1e-9){
      var best=ui.simGoal==='subject'?generalAvg(withGrades(gs.filter(function(g){return g.subject===sub;}),sub,10,n),'all'):generalAvg(withGrades(gs,sub,10,n),mode());
      h+='<div class="sim"><span>'+t+'</span><b class="bad">Non basta</b><small>con '+(n===1?'un 10':n+' dieci')+' arrivi a '+f2(best)+'</small></div>';
    } else {
      h+='<div class="sim"><span>'+t+'</span><b class="'+(x<=6.5?'ok':x<=8.5?'warn':'bad')+'">'+fmtGrade(x)+'</b><small>serve almeno '+f2(x)+(n>1?' in ognuno':'')+'</small></div>';
    }
  });
  el.innerHTML=h+'</div>';
}
function wiOut(){
  var el=$('#wiOut'); if(!el) return;
  var p=parseGrade(ui.wiGrade);
  if(!p){ el.innerHTML='<p class="sub" style="margin-top:12px">Scrivi un voto da 1 a 10, per esempio 7, 6½ o 5+.</p>'; return; }
  var gs=gradesP(), sub=ui.wiSubject, h2=withGrades(gs,sub,p.value,1);
  var s0=bySubject(gs).get(sub), s1=bySubject(h2).get(sub), g0=generalAvg(gs,mode()), g1=generalAvg(h2,mode());
  function line(name,a,b){
    var d=a==null?null:b-a;
    return '<div><span>'+name+'</span><span>'+(a==null?'–':'<b class="num">'+f2(a)+'</b>')+' → <b class="num">'+f2(b)+'</b>'+(d==null?'':' <span class="'+(d>=0?'up':'down')+'">('+sgn(d)+')</span>')+'</span></div>';
  }
  el.innerHTML='<div class="wi">'+line('Media '+esc(sub),s0?s0.avg:null,s1.avg)+line('Media generale',g0,g1)+'</div>';
}

    (ui.pendingImport?'<p style="margin:0 0 10px">Il file contiene <b>'+ui.pendingImport.grades.length+'</b> voti. Sostituire i dati attuali?</p><div class="panel-actions" style="margin:0 0 14px"><button class="btn-primary" type="button" data-a="importyes">Sì, sostituisci</button><button class="btn" type="button" data-a="importno">Annulla</button></div>':'')+
    (ui.confirmClear?'<p style="margin:0 0 10px">Eliminare tutti i voti? Non si può annullare.</p><button class="btn btn-danger" type="button" data-a="clearyes">Sì, elimina tutto</button> <button class="btn" type="button" data-a="clearno">Annulla</button>':'<button class="btn btn-danger" type="button" data-a="clearask">Elimina tutti i voti</button>')+'</section>';
  return h+'</div>';

/* ---------- Form voto ---------- */
function openForm(id,subject){
  ui.editId=id||null; ui.formOpen=true;
  var g=id?state.grades.filter(function(x){return x.id===id;})[0]:null;
  var sel=g?g.subject:(subject||ui.lastSubject||ui.subject||state.subjects[0]);
  var h='<form id="gradeForm" class="card panel" novalidate><div class="panel-head"><h2>'+(g?'Modifica voto':'Nuovo voto')+'</h2><button class="lnk" type="button" data-a="closeform">Chiudi</button></div><div class="form-grid">'+
    '<div class="field"><label for="frmSubject">Materia</label><select id="frmSubject">'+state.subjects.map(function(n){return '<option value="'+esc(n)+'"'+(n===sel?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'<option value="__new">＋ Nuova materia…</option></select></div>'+
    '<div class="field" id="newWrap" hidden><label for="frmNew">Nome della materia</label><input id="frmNew" type="text" maxlength="40" autocomplete="off"></div>'+
    '<div class="field wide"><label for="frmGrade">Voto <span class="hint">7, 7+, 7½, 6-, 5/6</span></label><input id="frmGrade" type="text" maxlength="6" autocomplete="off" value="'+(g?esc(g.label):'')+'"><div class="keys">'+
    [4,5,6,7,8,9,10].map(function(k){return '<button class="key" type="button" data-a="key" data-k="'+k+'">'+k+'</button>';}).join('')+'<span class="sep"></span>'+
    '<button class="key m" type="button" data-a="mod" data-m="-" aria-label="meno">−</button><button class="key m" type="button" data-a="mod" data-m="½" aria-label="e mezzo">½</button><button class="key m" type="button" data-a="mod" data-m="+" aria-label="più">+</button></div></div>'+
    '<div class="field"><label for="frmDate">Data</label><input id="frmDate" type="date" value="'+(g?esc(g.date):todayISO())+'"></div>'+
    '<div class="field"><label for="frmType">Prova</label><select id="frmType">'+TYPES.map(function(t){return '<option'+(g&&g.type===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div>'+
    '<div class="field wide"><label for="frmNote">Note <span class="hint">argomento o commento</span></label><input id="frmNote" type="text" maxlength="120" autocomplete="off" value="'+(g?esc(g.note):'')+'"></div></div>'+
    '<p class="err" id="frmErr" role="alert" hidden></p><div class="panel-actions"><button class="btn-primary" type="submit">Salva</button>'+(g?'':'<button class="btn" type="button" data-a="savemore">Salva e aggiungi un altro</button>')+'</div></form>';
  $('#formHost').innerHTML=h;
  $('#frmGrade').focus();
  var gf=$('#gradeForm'); if(gf.scrollIntoView) gf.scrollIntoView({block:'nearest'});
}
function closeForm(){ ui.formOpen=false; ui.editId=null; $('#formHost').innerHTML=''; }
function formErr(msg){ var e=$('#frmErr'); e.textContent=msg; e.hidden=false; }
function saveForm(more){
  var sv=$('#frmSubject').value, subject=sv;
  if(sv==='__new'){
    subject=$('#frmNew').value.trim();
    if(!subject) return formErr('Scrivi il nome della materia.');
  }
  var p=parseGrade($('#frmGrade').value);
  if(!p){
    var raw=$('#frmGrade').value.trim();
    return formErr(raw?'Voto non valido. Usa un numero da 1 a 10, anche 7+, 7½, 6- oppure 5/6.':'Scrivi il voto.');
  }
  var date=$('#frmDate').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return formErr('Scegli la data della prova.');
  var type=$('#frmType').value, note=$('#frmNote').value.trim();
  var ex=state.subjects.filter(function(n){return n.toLowerCase()===subject.toLowerCase();})[0];
  if(ex) subject=ex; else state.subjects.push(subject);
  if(state.demo){ state.grades=state.grades.filter(function(g){return !g.demo;}); state.demo=false; }
  var target=ui.editId?state.grades.filter(function(x){return x.id===ui.editId;})[0]:null;
  if(target){ target.subject=subject; target.value=p.value; target.label=p.label; target.date=date; target.type=type; target.note=note; }
  else { state.grades.push({id:newId(),subject:subject,value:p.value,label:p.label,date:date,type:type,note:note,ts:Date.now()}); }
  ui.lastSubject=subject; commit();
  if(more&&!ui.editId){
    renderAll(); openForm(null,subject);
    $('#frmDate').value=date; $('#frmType').value=type;
    toast('Voto salvato');
  } else { var wasEdit=!!ui.editId; closeForm(); renderAll(); toast(wasEdit?'Voto aggiornato':'Voto salvato'); }
}

/* ---------- Schermata ---------- */
function renderChrome(){
  $('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab" type="button" data-a="tab" data-t="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>';}).join('');
  $('#seg').innerHTML=PERIODS.map(function(p){return '<button type="button" data-a="period" data-p="'+p[0]+'" aria-pressed="'+(ui.period===p[0])+'">'+p[1]+'</button>';}).join('');
  $('#banner').innerHTML=state.demo?'<div class="demo"><span><b>Dati di esempio.</b> Spariscono quando inserisci il tuo primo voto.</span><button class="btn" type="button" data-a="democlear">Inizia con i miei voti</button></div>':'';
  var d=new Date(), y=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;
  $('#yearLine').textContent='Anno scolastico '+y+'/'+String(y+1).slice(2);
  renderAcct();
}
function renderTab(){
  redraws=[];
  var v=$('#view'), t=ui.tab, html;
  if(t==='materie') html=viewSubject();
  else if(t==='voti') html=viewGrades();
  else if(t==='simulatore') html=viewSim();
  else if(t==='impostazioni') html=viewSettings();
  else html=viewOverview();
  v.innerHTML=html;
  if(t==='panoramica') afterOverview();
  else if(t==='materie') afterSubject();
  else if(t==='simulatore'){ simOut(); wiOut(); }
}
function renderAll(){ renderChrome(); renderTab(); setSync(syncMode); }
var toastT=null;
function toast(msg){ var el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ el.hidden=true; },2200); }
function go(t){
  if(location.hash==='#'+t){ ui.tab=t; ui.confirmDel=null; renderAll(); }
  else location.hash=t;
}
function onHash(){
  var t=location.hash.slice(1);
  if(TABS.some(function(x){return x[0]===t;})){ ui.tab=t; ui.confirmDel=null; ui.confirmClear=false; renderAll(); window.scrollTo(0,0); }
}

/* ---------- Azioni ---------- */
function addSubject(name){
  name=name.trim(); if(!name) return false;
  if(state.subjects.some(function(n){return n.toLowerCase()===name.toLowerCase();})) return false;
  state.subjects.push(name); commit(); return true;
}
var actions={
  tab:function(b){ go(b.dataset.t); },
  signin:function(){
    if(!fb) return;
    fb.signIn(fb.auth,new fb.Provider()).catch(function(e){
      var c=e&&e.code?String(e.code):'';
      if(/popup-closed|cancelled/.test(c)) return;
      toast('Accesso non riuscito'+(c?' ('+c+')':''));
    });
  },
  signout:function(){ if(fb) fb.signOut(fb.auth); },
  exportjson:function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='registro-voti-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
  },
  importpick:function(){ var i=$('#impFile'); if(i) i.click(); },
  importyes:function(){
    if(!ui.pendingImport) return;
    state=ui.pendingImport; state.demo=false; ui.pendingImport=null;
    commit(); renderAll(); toast('Dati caricati');
  },
  importno:function(){ ui.pendingImport=null; renderTab(); },
  period:function(b){ ui.period=b.dataset.p; renderAll(); },
  add:function(){ openForm(null); },
  addfor:function(b){ openForm(null,b.dataset.s); },
  edit:function(b){ openForm(b.dataset.id); },
  closeform:function(){ closeForm(); },
  key:function(b){ var i=$('#frmGrade'); i.value=b.dataset.k; i.focus(); },
  mod:function(b){
    var i=$('#frmGrade'), m=/^(\d{1,2})/.exec(i.value.trim()); if(!m) return;
    var cur=i.value.trim().slice(m[1].length); i.value=m[1]+(cur===b.dataset.m?'':b.dataset.m); i.focus();
  },
  savemore:function(){ saveForm(true); },
  del:function(b){ ui.confirmDel=b.dataset.id; renderTab(); },
  delno:function(){ ui.confirmDel=null; renderTab(); },
  delyes:function(b){
    state.grades=state.grades.filter(function(g){return g.id!==b.dataset.id;});
    ui.confirmDel=null; commit(); renderAll(); toast('Voto eliminato');
  },
  selsubj:function(b){ ui.subject=b.dataset.s; renderTab(); },
  opensubj:function(b){ ui.subject=b.dataset.s; go('materie'); },
  democlear:function(){ state.grades=state.grades.filter(function(g){return !g.demo;}); state.demo=false; commit(); renderAll(); },
  subjadd:function(){ var i=$('#setNewSubj'); if(addSubject(i.value)) renderTab(); else { i.focus(); } },
  subjdel:function(b){ state.subjects=state.subjects.filter(function(n){return n!==b.dataset.s;}); commit(); renderTab(); },
  clearask:function(){ ui.confirmClear=true; renderTab(); },
  clearno:function(){ ui.confirmClear=false; renderTab(); },
  clearyes:function(){ state.grades=[]; state.demo=false; ui.confirmClear=false; commit(); renderAll(); toast('Voti eliminati'); }
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b) return;
  var f=actions[b.dataset.a]; if(f) f(b,e);
});
document.addEventListener('submit',function(e){ if(e.target.id==='gradeForm'){ e.preventDefault(); saveForm(false); } });
document.addEventListener('change',function(e){
  var id=e.target.id, v=e.target.value;
  if(id==='impFile'){
    var fl=e.target.files&&e.target.files[0]; if(!fl) return;
    fl.text().then(function(t){
      try{ var d=JSON.parse(t); if(!d||!Array.isArray(d.grades)) throw new Error('bad'); ui.pendingImport=normalize(d); renderTab(); }
      catch(err){ toast('File non valido'); }
    });
    return;
  }
  if(id==='frmSubject'){ $('#newWrap').hidden=v!=='__new'; if(v==='__new') $('#frmNew').focus(); }
  else if(id==='fSubject'){ ui.fSubject=v; renderTab(); }
  else if(id==='fType'){ ui.fType=v; renderTab(); }
  else if(id==='simGoal'){ ui.simGoal=v; renderTab(); }
  else if(id==='simSubject'){ ui.simSubject=v; simOut(); }
  else if(id==='wiSubject'){ ui.wiSubject=v; wiOut(); }
  else if(id==='setCut'){ if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ state.settings.cutoff=v; commit(); toast('Data salvata'); } }
  else if(e.target.name==='gmode'){ state.settings.mode=v; commit(); toast('Calcolo aggiornato'); }
});
document.addEventListener('input',function(e){
  var id=e.target.id, v=e.target.value;
  if(id==='simTarget'){ var n=parseFloat(String(v).replace(',','.')); ui.simTarget=isNaN(n)?0:n; simOut(); }
  else if(id==='wiGrade'){ ui.wiGrade=v; wiOut(); }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&ui.formOpen) closeForm();
  if(e.key==='Enter'&&e.target.id==='setNewSubj'){ e.preventDefault(); actions.subjadd(); }
});
window.addEventListener('hashchange',onHash);

/* ---------- Avvio ---------- */
(function start(){
  var t=location.hash.slice(1);
  if(TABS.some(function(x){return x[0]===t;})) ui.tab=t;
  renderAll();
  setSync('connecting');
  initDb();
})();
})();
</script>
</body>
</html>
