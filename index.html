<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237aa2ff'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='%230a1020' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ── themes.css ── */
/* Palette: dark è il tema predefinito, light è selezionabile dalle Impostazioni. */
:root, :root[data-theme="dark"] {
  --bg:#0c111c; --surface:#131a29; --surface-2:#1a2336; --line:#27324b; --line-soft:#1d2740;
  --fg:#e7ebf4; --fg-2:#a6b0c6; --fg-3:#7280a0;
  --accent:#7aa2ff; --accent-ink:#0a1020; --accent-soft:rgba(122,162,255,.15);
  --ok:#52d6a8; --ok-soft:rgba(82,214,168,.14);
  --warn:#f2b64a; --warn-soft:rgba(242,182,74,.15);
  --bad:#ff7b84; --bad-soft:rgba(255,123,132,.15);
  --font-display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eef1f8; --line:#d5dbea; --line-soft:#e4e8f2;
  --fg:#141b2d; --fg-2:#46526e; --fg-3:#76829b;
  --accent:#2e5ad6; --accent-ink:#ffffff; --accent-soft:rgba(46,90,214,.10);
  --ok:#0c8a65; --ok-soft:rgba(12,138,101,.12);
  --warn:#9c6307; --warn-soft:rgba(156,99,7,.12);
  --bad:#c4313f; --bad-soft:rgba(196,49,63,.10);
  color-scheme:light;
}


/* ── style.css ── */

/* Layout: una colonna centrata, barra con schede + filtro periodo, sezioni a schede sotto. Scuro di base, chiaro se il sistema lo chiede. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg); color:var(--fg); font:15px/1.5 var(--font-body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{margin:0;font-family:var(--font-display);text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Intestazione */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:22px 0 16px}
.brand h1{font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:3px 0 0;color:var(--fg-3);font-size:13px}
.top-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg-3);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--warn)} .sync.err i{background:var(--bad)}
.btn,.btn-primary{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-primary:hover{filter:brightness(1.08)}
.btn-danger{border-color:var(--bad);color:var(--bad)}
.lnk{appearance:none;background:none;border:0;padding:6px 4px;color:var(--fg-2);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.lnk:hover{color:var(--fg)} .lnk.bad{color:var(--bad)}

/* Barra schede + periodo */
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;color:var(--fg-2);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px;margin-bottom:8px}
.seg button{appearance:none;border:0;background:none;color:var(--fg-2);padding:6px 11px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* Schede e testi */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:18px}
.card + .card, .stack > * + *{margin-top:16px}
.card h2{font-size:15px;font-weight:600;margin-bottom:4px}
.sub{color:var(--fg-3);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.empty{text-align:center;padding:36px 18px}
.empty h2{font-size:18px;margin-bottom:6px}
.empty p{color:var(--fg-2);margin:0 auto 16px;max-width:42ch}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;background:var(--warn-soft);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.demo b{color:var(--warn)}

/* Panoramica */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 32px;align-items:center}
.big{font:700 68px/1 var(--font-display);letter-spacing:-.03em;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.big.ok{color:var(--ok)} .big.warn{color:var(--warn)} .big.bad{color:var(--bad)}
.hero-sub{margin:0;color:var(--fg-2);font-size:14px}
.delta{margin:8px 0 0;font-size:13px;font-weight:500}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.facts{margin:0;display:grid;gap:12px}
.facts div{display:grid;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.facts div:last-child{border-bottom:0;padding-bottom:0}
.facts dt{font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:0;font-size:15px;min-width:0;overflow-wrap:anywhere}
.facts small{color:var(--fg-3)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 9px;border-radius:6px;font:600 15px var(--font-display);font-variant-numeric:tabular-nums;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}

/* Grafici */
.chart-wrap{position:relative;margin-top:6px}
.chart-wrap svg{display:block;max-width:100%;height:auto;touch-action:pan-y;overflow:visible}
.grid{stroke:var(--line-soft);stroke-width:1}
.axis-t{fill:var(--fg-3);font:11px var(--font-body)}
.suff{stroke:var(--fg-3);stroke-width:1;stroke-dasharray:4 4;opacity:.8}
.suff-t{fill:var(--fg-3);font:11px var(--font-body)}
.cut{stroke:var(--fg-3);stroke-width:1;stroke-dasharray:2 4}
.ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--accent-soft);stroke:none}
.dot-ok{fill:var(--ok)} .dot-warn{fill:var(--warn)} .dot-bad{fill:var(--bad)}
.dot{stroke:var(--surface);stroke-width:1.5}
.endv{fill:var(--fg);font:600 13px var(--font-display)}
.hv-c{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;z-index:3;max-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.tip b{font-weight:600}
.tip .m{color:var(--fg-3)}

/* Righe per materia */
.subj{appearance:none;display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr) 58px;gap:6px 14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-soft);padding:11px 4px;cursor:pointer;color:inherit}
.subj:first-of-type{border-top:0}
.subj:hover{background:var(--surface-2)}
.s-name{min-width:0}
.s-name b{display:block;font-weight:600;overflow-wrap:anywhere}
.s-name small{color:var(--fg-3);font-size:12px}
.track{position:relative;height:8px;background:var(--surface-2);border-radius:4px}
.fill{height:100%;border-radius:4px}
.fill.ok{background:var(--ok)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.mark6{position:absolute;left:60%;top:-3px;bottom:-3px;width:1px;background:var(--fg-3)}
.s-avg{text-align:right;font:600 17px var(--font-display);font-variant-numeric:tabular-nums}
.s-avg.ok{color:var(--ok)} .s-avg.warn{color:var(--warn)} .s-avg.bad{color:var(--bad)} .s-avg.none{color:var(--fg-3);font-weight:400}

/* Materie */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer}
.chip b{color:var(--fg);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip[aria-pressed="true"] b{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px}
.stat span{display:block;font-size:12px;color:var(--fg-3)}
.stat b{display:block;font:600 22px var(--font-display);font-variant-numeric:tabular-nums;margin-top:2px}
.stat b.ok{color:var(--ok)} .stat b.warn{color:var(--warn)} .stat b.bad{color:var(--bad)}
.types{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0;color:var(--fg-2);font-size:14px}
.types span b{color:var(--fg);font-variant-numeric:tabular-nums}

/* Elenco voti */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.filters .field{min-width:150px;flex:1 1 150px}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line-soft)}
.row:first-of-type{border-top:0}
.r-date{font-size:13px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.r-main{min-width:0;overflow-wrap:anywhere}
.r-main b{font-weight:600;margin-right:8px}
.tag{display:inline-block;font-size:11px;color:var(--fg-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;vertical-align:middle}
.r-note{color:var(--fg-3);font-size:13px;margin-top:2px}
.acts{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg-2);justify-content:flex-end}

/* Form */
.panel{border-color:var(--accent);margin-bottom:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px 14px}
.field{display:grid;gap:5px;align-content:start;min-width:0}
.field.wide{grid-column:1/-1}
label,.lab{font-size:12px;color:var(--fg-2);font-weight:500}
.hint{color:var(--fg-3);font-weight:400;margin-left:6px}
input[type="text"],input[type="number"],input[type="date"],select{width:100%;min-height:42px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:16px;color:var(--fg)}
input:focus,select:focus{border-color:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.key{appearance:none;min-width:42px;min-height:38px;border:1px solid var(--line);background:var(--surface);border-radius:7px;font:600 15px var(--font-display);cursor:pointer;color:var(--fg)}
.key:hover{background:var(--surface-2)}
.key.m{color:var(--accent);border-color:var(--accent-soft)}
.keys .sep{width:10px}
.err{margin:10px 0 0;color:var(--bad);font-size:13px}
.panel-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* Simulatore */
.sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.sim{background:var(--bg);border:1px solid var(--line-soft);border-radius:10px;padding:14px}
.sim span{font-size:12px;color:var(--fg-3);display:block}
.sim b{display:block;font:700 34px/1.1 var(--font-display);margin:4px 0;font-variant-numeric:tabular-nums}
.sim b.ok{color:var(--ok)} .sim b.warn{color:var(--warn)} .sim b.bad{color:var(--bad)}
.sim small{color:var(--fg-2);font-size:13px}
.now{margin:12px 0 0;color:var(--fg-2);font-size:14px}
.wi{display:grid;gap:8px;margin-top:14px}
.wi div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;font-size:14px}
.wi .up{color:var(--ok)} .wi .down{color:var(--bad)}

/* Impostazioni */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid2 .card + .card{margin-top:0}
.grid2 .wide{grid-column:1/-1}
.radio{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;cursor:pointer}
.radio input{margin-top:4px;accent-color:var(--accent)}
.radio small{display:block;color:var(--fg-3)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.srow:first-of-type{border-top:0}
.srow small{color:var(--fg-3)}
.addrow{display:flex;gap:10px;margin-top:12px}
.addrow input{flex:1;min-width:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px)}

@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .big{font-size:58px}
  .row{grid-template-columns:48px minmax(0,1fr) auto}
  .row .acts{grid-column:2/-1;justify-content:flex-start}
  .subj{grid-template-columns:minmax(0,1fr) 58px}
  .subj .track{grid-column:1/-1;order:3}
  .card{padding:16px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Rifinitura UI: spaziatura, superfici e navigazione più leggibili. */
body {
  background:
    radial-gradient(ellipse at 8% -10%, var(--accent-soft), transparent 34rem),
    var(--bg);
}
.wrap { max-width:1120px; padding-left:8px; padding-right:8px; }
.brand h1 { font-size:27px; letter-spacing:-.035em; }
.top { padding-top:26px; padding-bottom:20px; }
.bar {
  position:sticky; top:0; z-index:10; align-items:center; padding:8px 0 10px;
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); margin-bottom:22px;
}
.tab {
  border:1px solid transparent; border-bottom:1px solid transparent;
  border-radius:9px; margin:0; padding:8px 13px;
}
.tab[aria-current="page"] {
  background:var(--accent-soft); border-color:var(--line-soft); color:var(--accent);
}
.card {
  border-radius:15px;
  box-shadow:0 8px 28px rgba(0,0,0,.045);
}
.btn,.btn-primary,.key,.chip,.theme-option { transition:background-color .16s ease,border-color .16s ease,filter .16s ease,transform .16s ease; }
.btn:active,.btn-primary:active,.key:active,.chip:active { transform:translateY(1px); }
input[type="text"],input[type="number"],input[type="date"],select { border-radius:10px; }
.panel { box-shadow:0 12px 34px rgba(0,0,0,.09); }
#view { padding-bottom:24px; }


/* ── responsive.css ── */
/* Layout adattivo per monitor, tablet e smartphone. */
.top-actions { min-width: 0; }
#tabs { min-width: 0; }

.chart-annotation {
  margin-top:10px; padding:10px 13px; border:1px solid var(--line);
  border-left:3px solid var(--accent); border-radius:9px;
  background:var(--surface-2); color:var(--fg-2); font-size:13px;
}
.chart-callout {
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
  gap:6px 14px; margin:10px 0 14px; padding:12px 14px;
  border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:9px; background:var(--surface-2);
}
.chart-callout-label { color:var(--fg-2); font-size:12px; font-weight:600; }
.chart-callout-value { color:var(--fg); font-size:14px; }
.chart-callout-value strong { color:var(--accent); font-size:18px; }

.theme-options { display:flex; flex-wrap:wrap; gap:10px; }
.theme-option {
  display:flex; align-items:center; gap:9px; min-height:42px; padding:8px 13px;
  border:1px solid var(--line); border-radius:9px; background:var(--surface-2);
  color:var(--fg); cursor:pointer;
}
.theme-option[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.theme-swatch { width:18px; height:18px; display:inline-block; border:1px solid var(--line); border-radius:50%; }
.theme-dark { background:#111827; }
.theme-light { background:#f3f5fa; }
.danger-zone { border-color:color-mix(in srgb, var(--bad) 35%, var(--line)); }
.confirm-box { padding:13px; border-radius:9px; background:var(--bad-soft); }
.confirm-box p { margin:0 0 12px; }

.report-summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.report-summary-item { display:grid; gap:5px; padding:14px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px; }
.report-summary-item span { color:var(--fg-3); font-size:12px; }
.report-summary-item strong { font:700 25px/1.2 var(--font-display); }
.report-summary-item strong.ok { color:var(--ok); }
.report-summary-item strong.warn { color:var(--warn); }
.report-summary-item strong.bad { color:var(--bad); }
.report-table { display:grid; gap:0; margin-top:12px; }
.report-head, .report-row { display:grid; grid-template-columns:minmax(140px,1.15fr) repeat(3,minmax(0,1fr)); gap:10px; align-items:stretch; }
.report-head { padding:0 12px 9px; color:var(--fg-3); font-size:12px; font-weight:600; }
.report-row { padding:10px 12px; border-top:1px solid var(--line-soft); }
.report-subject { display:flex; align-items:center; font-weight:600; overflow-wrap:anywhere; }
.report-cell { display:grid; align-content:center; gap:3px; min-width:0; }
.report-cell strong { font:700 19px/1.2 var(--font-display); font-variant-numeric:tabular-nums; }
.report-cell strong.ok { color:var(--ok); }
.report-cell strong.warn { color:var(--warn); }
.report-cell strong.bad { color:var(--bad); }
.report-cell small { color:var(--fg-3); font-size:11px; }
.report-cell small b { color:var(--fg); font-size:13px; }
.report-empty { color:var(--fg-3); }
.report-disclaimer { margin:16px 0 0; padding-top:12px; border-top:1px solid var(--line-soft); color:var(--fg-3); font-size:12px; }
.section-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }

@media (max-width: 760px) {
  body { padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px)); }
  .top { align-items:flex-start; }
  .top-actions { width:100%; justify-content:space-between; gap:8px; }
  .bar { align-items:stretch; gap:8px; }

<script>
"use strict";
const _RV = Object.create(null);
// ── utils.js ──
_RV['utils'] = (function(){

/** Utility condivise: DOM, formattazione, date e identificativi. */
const MONTHS = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const DAY = 864e5;

function $(selector, root) {
  return (root || document).querySelector(selector);
}

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];
  });
}

const numberFormat = new Intl.NumberFormat('it-IT', {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});

function f2(value) {
  return value == null || Number.isNaN(value) ? '–' : numberFormat.format(value);
}

function sgn(value) {
  return (value >= 0 ? '+' : '−') + f2(Math.abs(value));
}

function cls(value) {
  return value < 5 ? 'bad' : value < 6 ? 'warn' : 'ok';
}

function dShort(isoDate) {
  return (+isoDate.slice(8)) + ' ' + MONTHS[+isoDate.slice(5, 7) - 1];
}

function dLong(isoDate) {
  return dShort(isoDate) + ' ' + isoDate.slice(0, 4);
}

function todayISO() {
  const date = new Date();
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}

function newId() {
  return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

return {MONTHS, DAY, $, esc, f2, sgn, cls, dShort, dLong, todayISO, newId};
})();

// ── calculations.js ──
_RV['calculations'] = (function(){

/** Funzioni pure per voti, medie e simulazioni. */
function parseGrade(raw) {
  const value = String(raw == null ? '' : raw).trim().replace(/\s+/g, '').replace(',', '.').replace(/[−–]/g, '-');
  if (!value) return null;

  let match = value.match(/^(\d{1,2})\/(\d{1,2})$/);
  if (match) {
    const first = +match[1], second = +match[2];
    if (Math.abs(first - second) !== 1) return null;
    const grade = (first + second) / 2;
    if (grade < 1 || grade > 10) return null;
    return {value: grade, label: Math.min(first, second) + '/' + Math.max(first, second)};
  }

  match = value.match(/^(\d{1,2})(?:\.(\d{1,2}))?(\+|-|½)?$/);
  if (!match || (match[2] && match[3])) return null;
  let grade = match[2] ? parseFloat(match[1] + '.' + match[2]) : +match[1];
  if (match[3] === '+') grade += 0.25;
  else if (match[3] === '-') grade -= 0.25;
  else if (match[3] === '½') grade += 0.5;
  if (grade < 1 || grade > 10) return null;

  let label = value.replace('.', ',');
  if (!match[3] && match[2] && grade % 1 === 0.5) label = Math.floor(grade) + '½';
  return {value: grade, label: label};
}

function fmtGrade(value) {
  const quarter = Math.ceil(value * 4 - 1e-9) / 4;
  const integer = Math.floor(quarter + 1e-9);
  const fraction = Math.round((quarter - integer) * 4);
  if (fraction === 0) return String(integer);
  if (fraction === 1) return integer + '+';
  if (fraction === 2) return integer + '½';
  return (integer + 1) + '-';
}

function cmp(first, second) {
  return first.date < second.date ? -1 : first.date > second.date ? 1 : ((first.ts || 0) - (second.ts || 0));
}

function ts(date) {
  return Date.parse(date + 'T12:00:00');
}

function bySubject(grades) {
  const map = new Map();
  grades.forEach(function (grade) {
    let entry = map.get(grade.subject);
    if (!entry) {
      entry = {n: 0, sum: 0, list: []};
      map.set(grade.subject, entry);
    }
    entry.n++;
    entry.sum += grade.value;
    entry.list.push(grade);
  });
  map.forEach(function (entry) { entry.avg = entry.sum / entry.n; });
  return map;
}

/** mode='all': tutti i voti pesano uguale; mode='subjects': ogni materia pesa uguale. */
function generalAvg(grades, mode) {
  if (!grades.length) return null;
  if (mode === 'all') return grades.reduce((sum, grade) => sum + grade.value, 0) / grades.length;
  const subjects = bySubject(grades);
  let sum = 0;
  subjects.forEach(entry => { sum += entry.avg; });
  return sum / subjects.size;
}

function generalSeries(grades, mode) {
  const sorted = grades.slice().sort(cmp);
  const output = [], sums = new Map();
  let total = 0, count = 0;
  for (let index = 0; index < sorted.length; index++) {
    const grade = sorted[index];
    const entry = sums.get(grade.subject) || {n: 0, sum: 0};
    entry.n++;
    entry.sum += grade.value;
    sums.set(grade.subject, entry);
    total += grade.value;
    count++;
    const next = sorted[index + 1];
    if (next && next.date === grade.date) continue;

    let average;
    if (mode === 'all') average = total / count;
    else {
      let sum = 0;
      sums.forEach(item => { sum += item.sum / item.n; });
      average = sum / sums.size;
    }
    output.push({t: ts(grade.date), v: average, date: grade.date, day: sorted.filter(item => item.date === grade.date)});
  }
  return output;
}

function withGrades(grades, subject, value, count) {
  const output = grades.slice();
  for (let index = 0; index < count; index++) {
    output.push({subject: subject, value: value, date: '9999-12-31', ts: index});
  }
  return output;
}

function neededGrade(grades, mode, goal, subject, target, count) {
  const subjects = bySubject(grades);
  const current = subjects.get(subject) || {n: 0, sum: 0, avg: 0};
  if (goal === 'subject') return (target * (current.n + count) - current.sum) / count;
  if (mode === 'all') {
    const sum = grades.reduce((total, grade) => total + grade.value, 0);
    return (target * (grades.length + count) - sum) / count;
  }
  let otherAverageSum = 0;
  subjects.forEach((entry, name) => { if (name !== subject) otherAverageSum += entry.avg; });
  const subjectCount = subjects.size + (current.n > 0 ? 0 : 1);
  const requiredTotal = target * subjectCount - otherAverageSum;
  return (requiredTotal * (current.n + count) - current.sum) / count;
}

return {parseGrade, fmtGrade, cmp, ts, bySubject, generalAvg, generalSeries, withGrades, neededGrade};
})();

/** Gestione centralizzata del tema, persistente tra le visite. */
const THEME_KEY = 'registro-voti-theme';
let activeTheme = 'dark';

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (error) { /* Tema predefinito se lo storage è bloccato. */ }
  activeTheme = saved === 'light' || saved === 'dark' ? saved : 'dark';
  document.documentElement.dataset.theme = activeTheme;
  updateThemeColor();
  return activeTheme;
}

function setTheme(theme) {
  if (theme !== 'light' && theme !== 'dark') return activeTheme;
  activeTheme = theme;
  document.documentElement.dataset.theme = theme;
  updateThemeColor();
  try { localStorage.setItem(THEME_KEY, theme); } catch (error) { /* La UI resta utilizzabile anche senza storage. */ }
  return activeTheme;
}

function updateThemeColor() {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = activeTheme === 'light' ? '#f3f5fa' : '#0c111c';
}

function getTheme() {
  return activeTheme;
}

return {initTheme, setTheme, getTheme};
})();

// ── charts.js ──
_RV['charts'] = (function(){
const {DAY, MONTHS, $, esc, f2} = _RV['utils'];

const redraws = [];

function drawChart(host,o){
  function paint(){
    var pts=[];
    o.lines.forEach(function(l){ pts=pts.concat(l.pts); });
    pts=pts.concat(o.dots||[]);
    if(!pts.length){ host.innerHTML=''; return; }
    var W=Math.max(260,Math.floor(host.clientWidth||560)), H=W<480?220:280;

    var vmin=Math.min.apply(null,pts.map(function(p){return p.v;}));
    var yMin=Math.max(1,Math.min(5,Math.floor(vmin)-1)), yMax=10;
    function X(t){ return m.l+(t-t0)/(t1-t0)*(W-m.l-m.r); }

    var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(o.label)+'">';

    var ticks=[], range=t1-t0, i;
    if(range>=75*DAY){
      var d=new Date(t0); d=new Date(d.getFullYear(),d.getMonth()+1,1,12);
      while(+d<t1){ ticks.push({t:+d,l:MONTHS[d.getMonth()]+(d.getMonth()===0?' '+d.getFullYear():''),a:'middle'}); d=new Date(d.getFullYear(),d.getMonth()+1,1,12); }
      var step=Math.ceil(ticks.length/Math.max(2,Math.floor((W-m.l-m.r)/54)));
      ticks=ticks.filter(function(_,k){return k%step===0;});
    } else {
      for(i=0;i<=4;i++){ var tt=t0+range*i/4, dd=new Date(tt); ticks.push({t:tt,l:dd.getDate()+' '+MONTHS[dd.getMonth()],a:i===0?'start':i===4?'end':'middle'}); }
    }
    ticks.forEach(function(k){ s+='<text class="axis-t" x="'+X(k.t)+'" y="'+(H-8)+'" text-anchor="'+k.a+'">'+k.l+'</text>'; });
    if(o.cutoffT&&o.cutoffT>t0&&o.cutoffT<t1){

    }

      if(l.area&&l.pts.length>1){

      }

    });
    (o.dots||[]).forEach(function(p){ s+='<circle class="dot dot-'+p.c+'" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4"/>'; });
    var main=o.lines[0].pts, last=main[main.length-1];
    if(last){
      var lx=X(last.t), ly=Y(last.v);

    s+='</svg><div class="tip" hidden></div>';
    host.className='chart-wrap';
    host.innerHTML=s;
    if (o.annotation) {

    var svg=$('svg',host), tip=$('.tip',host), gl=$('.hv-l',host), gd=$('.hv-d',host);
    function hide(){ tip.hidden=true; gl.style.display='none'; gd.style.display='none'; }
    function show(cx){

      (o.hover||[]).forEach(function(h){ var dx=Math.abs(X(h.t)-x); if(dx<bd){ bd=dx; best=h; } });

      tip.style.left=left+'px';
    }
    svg.addEventListener('pointermove',function(e){ show(e.clientX); });
    svg.addEventListener('pointerdown',function(e){ show(e.clientX); });
    svg.addEventListener('pointerleave',hide);
  }

  redraws.push({host:host,w:host.clientWidth,paint:paint});
}

/**
 * Pagella: confronto fra primo quadrimestre, secondo quadrimestre e intero anno.
 * Il voto proposto è la media della materia arrotondata all'intero più vicino.
 */
function viewReportCard(){
  if (!store.state.grades.length) return emptyCard('Nessun voto ancora', 'Aggiungi alcuni voti per vedere una stima della tua pagella.');

  const cutoff = store.state.settings.cutoff;
  const first = store.state.grades.filter(grade => grade.date <= cutoff);
  const second = store.state.grades.filter(grade => grade.date > cutoff);
  const all = store.state.grades.slice();
  const averages = [
    {label: '1° quadrimestre', grades: first},
    {label: '2° quadrimestre', grades: second},
    {label: 'Anno completo', grades: all}
  ];

  let html = '<div class="stack report-page">';
  html += '<section class="card"><div class="section-heading"><div><h2>Riepilogo generale</h2><p class="sub">Medie calcolate con il criterio selezionato nelle impostazioni.</p></div></div><div class="report-summary">';
  averages.forEach(function (period) {
    const average = generalAvg(period.grades, mode());
    html += '<div class="report-summary-item"><span>' + period.label + '</span><strong class="' + (average == null ? '' : cls(average)) + '">' + f2(average) + '</strong></div>';
  });
  html += '</div></section>';

  html += '<section class="card"><h2>Voti per materia</h2><p class="sub">Ogni cella mostra la media e il voto intero suggerito. La Pagella presenta tutti e tre i periodi insieme.</p>';
  html += '<div class="report-table" role="table" aria-label="Stima della pagella">';
  html += '<div class="report-head" role="row"><div role="columnheader">Materia</div>' + averages.map(p => '<div role="columnheader">' + p.label + '</div>').join('') + '</div>';

  store.state.subjects.forEach(function (subject) {
    const cells = averages.map(function (period) {
      const entry = bySubject(period.grades).get(subject);
      if (!entry) return '<div class="report-cell report-empty" role="cell" data-label="' + period.label + '"><span>—</span><small>Nessun voto</small></div>';
      return '<div class="report-cell" role="cell" data-label="' + period.label + '"><strong class="' + cls(entry.avg) + '">' + f2(entry.avg) + '</strong><small>Voto suggerito <b>' + Math.round(entry.avg) + '</b></small></div>';
    }).join('');
    html += '<div class="report-row" role="row"><div class="report-subject" role="rowheader">' + esc(subject) + '</div>' + cells + '</div>';
  });

  html += '</div><p class="report-disclaimer">Stima indicativa: il voto effettivo in pagella dipende anche dalla valutazione del docente e non è determinato automaticamente dalla sola media aritmetica.</p></section></div>';
  return html;
}

    var cur=i.value.trim().slice(m[1].length); i.value=m[1]+(cur===b.dataset.m?'':b.dataset.m); i.focus();
  },
  savemore:function(){ saveForm(true); },
  del:function(b){ ui.confirmDel=b.dataset.id; renderTab(); },
  delno:function(){ ui.confirmDel=null; renderTab(); },
  delyes:function(b){
    state.grades=state.grades.filter(function(g){return g.id!==b.dataset.id;});
    ui.confirmDel=null; commit(); renderAll(); toast('Voto eliminato');
  },
  selsubj:function(b){ ui.subject=b.dataset.s; renderTab(); },
  opensubj:function(b){ ui.subject=b.dataset.s; go('materie'); },
  democlear:function(){ state.grades=state.grades.filter(function(g){return !g.demo;}); state.demo=false; commit(); renderAll(); },
  subjadd:function(){ var i=$('#setNewSubj'); if(addSubject(i.value)) renderTab(); else { i.focus(); } },
  subjdel:function(b){ state.subjects=state.subjects.filter(function(n){return n!==b.dataset.s;}); commit(); renderTab(); },
  clearask:function(){ ui.confirmClear=true; renderTab(); },
  clearno:function(){ ui.confirmClear=false; renderTab(); },
  clearyes:function(){ state.grades=[]; state.demo=false; ui.confirmClear=false; commit(); renderAll(); toast('Voti eliminati'); }
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b) return;
  var f=actions[b.dataset.a]; if(f) f(b,e);
});
document.addEventListener('submit',function(e){ if(e.target.id==='gradeForm'){ e.preventDefault(); saveForm(false); } });
document.addEventListener('change',function(e){
  var id=e.target.id, v=e.target.value;
  if(id==='impFile'){
    var fl=e.target.files&&e.target.files[0]; if(!fl) return;
    if(fl.size > 1024 * 1024){ toast('Il file supera il limite di 1 MB.'); e.target.value=''; return; }
    fl.text().then(function(t){
      try{ var d=JSON.parse(t); if(!d||!Array.isArray(d.grades)||d.grades.length>500||(Array.isArray(d.subjects)&&d.subjects.length>60)) throw new Error('bad'); ui.pendingImport=normalize(d); renderTab(); }
      catch(err){ toast('File non valido'); }
    });
    return;
  }
  if(id==='frmSubject'){ $('#newWrap').hidden=v!=='__new'; if(v==='__new') $('#frmNew').focus(); }
  else if(id==='fSubject'){ ui.fSubject=v; renderTab(); }
  else if(id==='fType'){ ui.fType=v; renderTab(); }
  else if(id==='simGoal'){ ui.simGoal=v; renderTab(); }
  else if(id==='simSubject'){ ui.simSubject=v; simOut(); }
  else if(id==='wiSubject'){ ui.wiSubject=v; wiOut(); }
  else if(id==='setCut'){ if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ state.settings.cutoff=v; commit(); toast('Data salvata'); } }
  else if(e.target.name==='gmode'){ state.settings.mode=v; commit(); toast('Calcolo aggiornato'); }
});
document.addEventListener('input',function(e){
  var id=e.target.id, v=e.target.value;
  if(id==='simTarget'){ var n=parseFloat(String(v).replace(',','.')); ui.simTarget=isNaN(n)?0:n; simOut(); }
  else if(id==='wiGrade'){ ui.wiGrade=v; wiOut(); }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&ui.formOpen) closeForm();
  if(e.key==='Enter'&&e.target.id==='setNewSubj'){ e.preventDefault(); actions.subjadd(); }
});
/* ---------- Avvio ---------- */
function start(){
  initTheme();
  const tab = location.hash.slice(1);
  if (TABS.some(item => item[0] === tab)) ui.tab = tab;
  renderAll();
  setSync('connecting');
  initDb();
}
window.addEventListener('hashchange', onHash);
start();

return {};
})();
</script>
</body>
</html>
